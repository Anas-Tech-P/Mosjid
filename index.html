
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f3d31">
<title>মসজিদ ম্যানেজমেন্ট</title>
<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1OmiyuOhFUBWfQUvupjZC5cEZ6zC-sPHY=w1000">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<style>
*{box-sizing:border-box;font-family:'SolaimanLipi','Hind Siliguri',sans-serif}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#0f3d31}
#app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0f3d31}
iframe{width:100%;height:100%;border:0;display:block;background:#f3f5f1}
#boot{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fff;color:#64748b;font-size:14px;text-align:center;padding:20px}
#boot img{width:84px;height:84px;border-radius:50%;object-fit:contain;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.sp{width:34px;height:34px;border:3px solid #e2e8f0;border-top-color:#0f5c47;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#retry{display:none;border:0;background:#0f5c47;color:#fff;padding:10px 22px;border-radius:10px;font-size:15px;cursor:pointer}
</style>
</head>
<body>

<div id="boot">
  <img src="https://lh3.googleusercontent.com/d/1OmiyuOhFUBWfQUvupjZC5cEZ6zC-sPHY=w1000" alt="Anas Tech">
  <div class="sp" id="sp"></div>
  <span id="msg">লোড হচ্ছে…</span>
  <button id="retry" onclick="loadApp()">আবার চেষ্টা করুন</button>
</div>

<div id="app"><iframe id="frame" allow="clipboard-write; fullscreen"></iframe></div>

<script>
/* ★★★ শুধু এই লাইনে আপনার মসজিদ সফটওয়্যারের Web App URL (/exec দিয়ে শেষ) বসান ★★★ */
var MOSQUE_URL = "https://script.google.com/macros/s/AKfycbzAHuSF8JNuPB3QawT4OlRhTkQ3bfiFEC91NOqeyuUptbUUt_zBA9tUDM4Gk01-g3guBA/exec";

var frame = document.getElementById('frame'), boot = document.getElementById('boot'), done = false, timer = null;

function loadApp() {
  done = false;
  document.getElementById('sp').style.display = 'block';
  document.getElementById('retry').style.display = 'none';
  document.getElementById('msg').textContent = 'লোড হচ্ছে…';
  boot.style.display = 'flex';
  if (!/^https:\/\//.test(MOSQUE_URL)) {
    document.getElementById('sp').style.display = 'none';
    document.getElementById('msg').textContent = 'অ্যাপের URL বসানো হয়নি।';
    return;
  }
  frame.onload = function () { done = true; clearTimeout(timer); boot.style.display = 'none'; };
  frame.src = MOSQUE_URL + (MOSQUE_URL.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now();
  clearTimeout(timer);
  timer = setTimeout(function () {
    if (done) return;
    document.getElementById('sp').style.display = 'none';
    document.getElementById('msg').textContent = 'লোড হতে দেরি হচ্ছে — ইন্টারনেট দেখে আবার চেষ্টা করুন।';
    document.getElementById('retry').style.display = 'inline-block';
  }, 20000);
}
window.addEventListener('DOMContentLoaded', loadApp);
</script>
</body>
</html>
